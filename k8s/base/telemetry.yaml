apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
  labels:
    app.kubernetes.io/name: telemetry
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: telemetry
      containers:
        - name: telemetry
          image: fleetsync/telemetry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: fleetsync-config
          env:
            - name: PORT
              value: "8001"
            - name: REDIS_DB
              value: "1"
            - name: TELEMETRY_HISTORY_LIMIT
              value: "500"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # CPU request is what the HPA utilisation target is measured against;
            # route optimisation is CPU-bound so this service scales first.
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry
  labels:
    app.kubernetes.io/name: telemetry
spec:
  selector:
    app.kubernetes.io/name: telemetry
  ports:
    - name: http
      port: 8001
      targetPort: http
