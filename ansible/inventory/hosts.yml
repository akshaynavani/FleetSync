# `control` drives Minikube, Terraform and kubectl. `lab_vms` is an optional group of
# remote virtual machines that get the same toolchain via the prerequisites role,
# simulating a fleet of build/worker hosts. Add hosts there to fan out.
all:
  children:
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    lab_vms:
      hosts: {}
      # Example:
      # hosts:
      #   vm-01:
      #     ansible_host: 192.168.56.11
      #     ansible_user: vagrant
      #   vm-02:
      #     ansible_host: 192.168.56.12
      #     ansible_user: vagrant
